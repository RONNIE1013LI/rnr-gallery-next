name: Production drift guard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 19 * * 0"

permissions:
  contents: read

concurrency:
  group: production-drift-guard
  cancel-in-progress: false

jobs:
  read-only-production-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.PRODUCTION_GUARD_GITHUB_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_DATABASE_AUDIT_URL: ${{ secrets.PRODUCTION_DATABASE_AUDIT_URL }}
      EXPECTED_PRODUCTION_DATABASE: ${{ secrets.EXPECTED_PRODUCTION_DATABASE }}
      EXPECTED_PRODUCTION_HOST_FINGERPRINT: ${{ secrets.EXPECTED_PRODUCTION_HOST_FINGERPRINT }}
      PRODUCTION_DATABASE_TARGET_FINGERPRINT: ${{ secrets.PRODUCTION_DATABASE_TARGET_FINGERPRINT }}
      PREVIEW_DATABASE_TARGET_FINGERPRINT: ${{ secrets.PREVIEW_DATABASE_TARGET_FINGERPRINT }}
      DEVELOPMENT_DATABASE_TARGET_FINGERPRINT: ${{ secrets.DEVELOPMENT_DATABASE_TARGET_FINGERPRINT }}
      TEST_DATABASE_TARGET_FINGERPRINT: ${{ secrets.TEST_DATABASE_TARGET_FINGERPRINT }}
      DATABASE_ENVIRONMENT_METADATA_FINGERPRINT: ${{ secrets.DATABASE_ENVIRONMENT_METADATA_FINGERPRINT }}
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Verify Node.js security baseline
        shell: bash
        run: |
          node -v
          node <<'NODE'
          const [major, minor, patch] = process.versions.node.split(".").map(Number);
          if (major !== 22 || !Number.isInteger(patch) || minor < 23 || (minor === 23 && patch < 4)) {
            console.error("Node.js 22.23.4 or newer in the 22.x line is required");
            process.exit(1);
          }
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Check Staging isolation and wait for automatic Production deploy
        if: github.event_name == 'push'
        shell: bash
        run: |
          for attempt in {1..45}; do
            if ! npm run staging:isolation:check; then
              exit 1
            fi
            if npm run production:guard; then
              exit 0
            fi
            if [ "$attempt" -eq 45 ]; then
              exit 1
            fi
            sleep 20
          done

      - name: Run scheduled or manual read-only guard
        if: github.event_name != 'push'
        run: npm run production:guard
