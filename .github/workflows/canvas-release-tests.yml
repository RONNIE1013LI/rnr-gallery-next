name: Canvas isolated release tests
on:
  push:
    branches: [codex/canvas-3d-product-20260906]
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PRODUCTION_DATABASE_TARGET_FINGERPRINTS: ${{ secrets.PRODUCTION_DATABASE_TARGET_FINGERPRINT }}
      EXPECTED_PRODUCTION_DATABASE: ${{ secrets.EXPECTED_PRODUCTION_DATABASE }}
      EXPECTED_PRODUCTION_HOST_FINGERPRINT: ${{ secrets.EXPECTED_PRODUCTION_HOST_FINGERPRINT }}
      BETTER_AUTH_URL: http://localhost:3017
      BETTER_AUTH_SECRET: ephemeral-canvas-ci-auth-secret-never-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:test:isolated
        env:
          RELEASE_TEST_DATABASE_ADMIN_URL: postgresql://postgres:ephemeral-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
