name: Canvas isolated release tests
on:
  push:
    branches: [codex/canvas-3d-product-20260906]
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      PRODUCTION_DATABASE_TARGET_FINGERPRINTS: ${{ secrets.PRODUCTION_DATABASE_TARGET_FINGERPRINT }}
      EXPECTED_PRODUCTION_DATABASE: ${{ secrets.EXPECTED_PRODUCTION_DATABASE }}
      EXPECTED_PRODUCTION_HOST_FINGERPRINT: ${{ secrets.EXPECTED_PRODUCTION_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install test runtime prerequisites
        run: |
          brew install postgresql@16 ripgrep
          echo "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"
      - name: Start isolated PostgreSQL
        run: |
          initdb -D "$RUNNER_TEMP/canvas-postgres" -U postgres -A trust
          pg_ctl -D "$RUNNER_TEMP/canvas-postgres" -l "$RUNNER_TEMP/canvas-postgres.log" -o "-h 127.0.0.1 -p 5432 -k $RUNNER_TEMP" -w start
          echo "RELEASE_TEST_DATABASE_ADMIN_URL=postgresql://postgres@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Check previously incompatible tests first
        run: >-
          npx vitest run scripts/backup-production-blob.test.ts
          src/server/customer-service/no-auto-send.test.ts
          src/server/customer-service/security-regression.test.ts
          src/server/customer-service/serverless-compatibility.test.ts
          src/server/customer-service/website/security-regression.test.ts
          src/components/admin/invoice-workspace.test.tsx
          src/components/forms/forms-stats-chart.test.tsx
          'src/app/api/admin/notification-recipients/[recipientId]/route.test.ts'
          'src/app/api/admin/notification-recipients/[recipientId]/verification/route.test.ts'
          'src/app/api/admin/uploads/[uploadId]/route.test.ts'
      - run: npm run release:test:isolated
      - name: Stop isolated PostgreSQL
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/canvas-postgres/postmaster.pid" ]; then
            pg_ctl -D "$RUNNER_TEMP/canvas-postgres" -m immediate -w stop
          fi
