name: Canvas product media release tests
on:
  push:
    branches: [fix/canvas-product-media-20260919]
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      PRODUCTION_DATABASE_TARGET_FINGERPRINTS: ${{ secrets.PRODUCTION_DATABASE_TARGET_FINGERPRINT }}
      EXPECTED_PRODUCTION_DATABASE: ${{ secrets.EXPECTED_PRODUCTION_DATABASE }}
      EXPECTED_PRODUCTION_HOST_FINGERPRINT: ${{ secrets.EXPECTED_PRODUCTION_HOST_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh authoritative production reference
        run: git fetch origin --prune
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Preserve exact source images for visual comparison
        uses: actions/upload-artifact@v4
        with:
          name: canvas-product-media-source-images
          path: |
            public/media/products/digital-oil-painting-canvas-shop.webp
            public/canvas-3d/digital-oil-artwork.avif
          retention-days: 3
      - name: Canvas product media regressions
        run: >-
          npx vitest run 'src/app/products/[slug]/canvas-media.test.tsx'
          'src/app/products/[slug]/page.test.tsx'
          src/components/canvas-product-preview.test.tsx
      - run: npm run typecheck
      - name: Lint changed application files
        run: npx eslint 'src/app/products/[slug]/page-content.tsx' 'src/app/products/[slug]/canvas-media.test.tsx' 'src/app/products/[slug]/page.test.tsx'
      - name: Install isolated test runtime prerequisites
        run: |
          brew install postgresql@16 ripgrep
          echo "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"
      - name: Start isolated PostgreSQL
        run: |
          initdb -D "$RUNNER_TEMP/canvas-media-postgres" -U postgres -A trust
          pg_ctl -D "$RUNNER_TEMP/canvas-media-postgres" -l "$RUNNER_TEMP/canvas-media-postgres.log" -o "-h 127.0.0.1 -p 5432 -k $RUNNER_TEMP" -w start
          echo "RELEASE_TEST_DATABASE_ADMIN_URL=postgresql://postgres@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
      - run: npm run release:test:isolated
      - name: Stop isolated PostgreSQL
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/canvas-media-postgres/postmaster.pid" ]; then
            pg_ctl -D "$RUNNER_TEMP/canvas-media-postgres" -m immediate -w stop
          fi
  local-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: canvas_browser_test_only
          POSTGRES_DB: rnr_gallery_test_canvas_media
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      EXPECTED_PRODUCTION_DATABASE: ${{ secrets.EXPECTED_PRODUCTION_DATABASE }}
      EXPECTED_PRODUCTION_HOST_FINGERPRINT: ${{ secrets.EXPECTED_PRODUCTION_HOST_FINGERPRINT }}
      LOCAL_BROWSER_DATABASE_URL: postgresql://postgres:canvas_browser_test_only@127.0.0.1:5432/rnr_gallery_test_canvas_media
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare disposable localhost-only application runtime
        shell: bash
        run: |
          TEST_DATABASE_URL="$LOCAL_BROWSER_DATABASE_URL" NODE_ENV=test npm run db:migrate -- --environment test
          echo "DATABASE_URL=$LOCAL_BROWSER_DATABASE_URL" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/canvas-browser" --no-save --package-lock=false playwright
          "$RUNNER_TEMP/canvas-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "CANVAS_BROWSER_RUNTIME=$RUNNER_TEMP/canvas-browser" >> "$GITHUB_ENV"
      - name: Verify local desktop and mobile image and WebGL preview
        shell: bash
        run: |
          mkdir -p artifacts/canvas-product-media
          node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3000 > artifacts/canvas-product-media/server.log 2>&1 &
          NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/products/digital-oil-painting-canvas) || status=000
            if [ "$status" = 200 ]; then break; fi
            if [ "$status" = 500 ]; then cat artifacts/canvas-product-media/server.log; exit 1; fi
            sleep 2
          done
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { resolve } from 'node:path';
          import { writeFile } from 'node:fs/promises';
          const { chromium } = createRequire(resolve(process.env.CANVAS_BROWSER_RUNTIME, 'package.json'))('playwright');
          const out = 'artifacts/canvas-product-media';
          const browser = await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--no-sandbox']});
          const results = [];
          try {
            for (const device of [{name:'desktop',width:1440,height:1100},{name:'mobile',width:390,height:844}]) {
              const context = await browser.newContext({viewport:{width:device.width,height:device.height},isMobile:device.name==='mobile',hasTouch:device.name==='mobile',deviceScaleFactor:1});
              const page = await context.newPage();
              page.setDefaultTimeout(60000);
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              try {
                const response=await page.goto('http://127.0.0.1:3000/products/digital-oil-painting-canvas',{waitUntil:'domcontentloaded',timeout:120000});
                assert.equal(response.status(),200);
                const image=page.locator('[data-product-media] img');
                await image.waitFor({state:'visible'});
                await image.evaluate(img=>img.decode());
                const geometry=await image.evaluate(img=>({fit:getComputedStyle(img).objectFit,ratio:img.parentElement.getBoundingClientRect().width/img.parentElement.getBoundingClientRect().height,src:img.currentSrc,loaded:img.naturalWidth>0}));
                assert.equal(geometry.fit,'contain');
                assert(Math.abs(geometry.ratio-4/3)<0.01);
                assert(geometry.loaded);
                assert(decodeURIComponent(geometry.src).includes('/media/products/digital-oil-painting-canvas-shop.webp'));
                await page.screenshot({path:`${out}/${device.name}-2d.png`,fullPage:true});
                await page.getByRole('button',{name:'3D View',exact:true}).click();
                const stage=page.getByRole('application',{name:'Interactive canvas. Drag to rotate; scroll or pinch to zoom.'});
                await stage.waitFor({state:'visible'});
                await page.waitForFunction(()=>document.querySelector('[data-ready="true"][data-artwork] canvas'),null,{timeout:90000});
                assert.equal(await stage.getAttribute('data-artwork'),'/canvas-3d/digital-oil-artwork.avif');
                await page.getByRole('button',{name:'Front',exact:true}).click();
                await page.waitForTimeout(200);
                const front=await stage.screenshot({path:`${out}/${device.name}-3d-front.png`});
                await page.getByRole('button',{name:'Back',exact:true}).click();
                await page.waitForTimeout(200);
                const back=await stage.screenshot({path:`${out}/${device.name}-3d-back.png`});
                assert(!front.equals(back),'Front and back must render different model views');
                await page.getByRole('button',{name:'Reset',exact:true}).click();
                const camera=await stage.getAttribute('data-camera');
                await page.getByRole('button',{name:'Zoom in',exact:true}).click();
                await page.waitForTimeout(200);
                assert.notEqual(await stage.getAttribute('data-camera'),camera);
                await page.getByRole('button',{name:'Close 3D view',exact:true}).click();
                await image.waitFor({state:'visible'});
                assert.equal(await page.locator('[data-artwork] canvas').count(),0);
                assert.deepEqual(errors,[]);
                results.push({device:device.name,...geometry,webgl:true,frontBack:true,zoom:true,close:true});
              } catch(error) {
                await page.screenshot({path:`${out}/${device.name}-failure.png`,fullPage:true});
                throw error;
              } finally {await context.close();}
            }
            await writeFile(`${out}/results.json`,JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
          } finally {await browser.close();}
          NODE
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-product-media-browser
          path: artifacts/canvas-product-media
          retention-days: 3
