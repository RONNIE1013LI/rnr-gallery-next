name: Import supplied showroom artwork
on:
  push:
    branches: [feature/true-3d-showroom]
    paths: [.github/workflows/showroom-assets-import.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/feature/true-3d-showroom'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/true-3d-showroom
      - name: Import exact user-supplied JPEG files with SHA-256 verification
        shell: python
        run: |
          import hashlib, pathlib, urllib.request
          root = pathlib.Path('public/media/showroom')
          root.mkdir(parents=True, exist_ok=True)
          assets = [
            ('banner.jpg', '60c8d35f0393d84575208499341be466dd27cdfa268073aa81081a2800e3ae9a', 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/9b51cdbe-bbfd-47c5-a90b-23640c311e65.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDkwZDE3MTc3MTgzNTkxMyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTkxMDQyM30.Z20zjP3IGWZrjLa0_vDB0qAsqaIRU57EBfj3xtby0Yk'),
            ('canvas.jpg', 'cfa78ca625c2fb29e165f6ba3ab54c7afcb682b2f21ea8aa23b606bac741127b', 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/a747064f-9706-434d-b8ea-bddb764d75cd.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzZjNWZlMTM0OTc2MmVmNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTk0NjAwM30.D_yHejzvSzVLSrlMTFnIw55Psw8wsmQ5gCbvrVj2aXg'),
            ('rollup.jpg', '49b97371a6b699f190b7c5f25eaee9f703cf69560a9ecd79b4736cd9f6456555', 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/d6ed528f-3dfd-407b-8590-733d42747493.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNmEwNDViNjU1MGQ4OTU4NyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTkwMjQzN30.TogW-oP2Zp3TqeuC8WLcWwiL8rRHncH8-1SD_YjX2SE')
          ]
          for name, digest, url in assets:
              with urllib.request.urlopen(url, timeout=35) as response:
                  data = response.read(10_000_001)
              assert len(data) <= 10_000_000, 'Asset size exceeded'
              assert hashlib.sha256(data).hexdigest() == digest, 'Artwork checksum mismatch: ' + name
              (root / name).write_bytes(data)
              print(name, len(data), 'verified')
      - name: Commit only the three supplied artworks to this preview branch
        run: |
          test "$GITHUB_REF" = refs/heads/feature/true-3d-showroom
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/showroom/banner.jpg public/media/showroom/canvas.jpg public/media/showroom/rollup.jpg
          git diff --cached --quiet || git commit -m 'Add verified original artwork textures for 3D showroom'
          git push origin HEAD:feature/true-3d-showroom
      - name: Prepare pinned renderer for local offline verification
        run: |
          mkdir -p /tmp/showroom-vendor
          cd /tmp/showroom-vendor
          npm pack three@0.180.0 --ignore-scripts
          tar -xzf three-0.180.0.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: showroom-renderer-verification
          path: |
            /tmp/showroom-vendor/package/build/three.module.js
            /tmp/showroom-vendor/package/build/three.core.js
            /tmp/showroom-vendor/package/LICENSE
          retention-days: 1
