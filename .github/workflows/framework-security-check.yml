name: Framework security verification

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - scripts/framework-security-baseline.test.ts
      - .github/workflows/framework-security-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Verify security and storefront boundaries
        run: |
          npm run test:run -- scripts/framework-security-baseline.test.ts scripts/production-deployment-guard.test.ts scripts/automation/production-access-guard.test.ts src/server/auth/config.test.ts src/server/auth/social-provider-config.test.ts src/server/auth/website-chat-storage.test.ts src/app/seo-routes.test.ts src/app/sitemap.test.ts src/app/au/categories.test.tsx 'src/app/products/[slug]/page.test.tsx' src/app/feeds/google-merchant-routes.test.ts src/server/merchant/google-merchant-feed.test.ts src/components/cart-view.test.tsx src/components/checkout-view.test.tsx src/components/stripe-payment-form.test.tsx src/components/payment-methods.test.tsx src/app/api/checkout/shipping/route.test.ts src/app/api/checkout/payment-methods/route.test.ts
      - name: Build with isolated local configuration
        env:
          BETTER_AUTH_URL: https://staging.rnrgallery.com
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/rnr_framework_ci
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$BETTER_AUTH_SECRET"
          npm run build
