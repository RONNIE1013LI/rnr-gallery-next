name: Isolated Node security verification

on:
  push:
    branches: [codex/node-security-20261023]
    paths:
      - .github/workflows/node-security-verification.yml
      - .github/workflows/production-guard.yml
      - .github/workflows/canvas-release-tests.yml
      - .github/workflows/reply-quality-release-tests.yml

permissions:
  contents: read

jobs:
  node-version:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            node: 22
          - runner: macos-15
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - name: Verify original workflow gates without application dependencies
        shell: bash
        run: |
          node -v
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { spawnSync } = require("node:child_process");
          const expected = {
            "production-guard.yml": "55cb37ec56d18d3e30d1081984b934ec68ef80e3ca953bd6c3dcfce56ceee7b7",
            "canvas-release-tests.yml": "d934691744d8011637a8bccfb59a34d450229aea8a4e112908c5cfe909298816",
            "reply-quality-release-tests.yml": "d62d8f327bbff8a57f93e73b6030cd2fb3541e31fecd9f45ca681aff72683c9d",
          };
          console.log(JSON.stringify({ version: process.version, execPath: process.execPath }));
          for (const [file, hash] of Object.entries(expected)) {
            const source = fs.readFileSync(`.github/workflows/${file}`, "utf8");
            if (crypto.createHash("sha256").update(source).digest("hex") !== hash) {
              throw new Error(`Workflow differs from audited a003bf48: ${file}`);
            }
            if ((file === "production-guard.yml") !== (process.versions.node.split(".")[0] === "22")) continue;
            const match = source.match(/          node <<'NODE'\n([\s\S]*?)          NODE/);
            if (!match) throw new Error(`Version gate not found: ${file}`);
            const result = spawnSync(process.execPath, ["-e", match[1]], { stdio: "inherit" });
            if (result.status !== 0) process.exit(1);
            console.log(`PASS ${file}: original security gate`);
          }
          NODE
